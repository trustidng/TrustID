{% extends "phone_base.html" %}{% block phone_content %}<style>.phone-home-head{padding:1.4rem .2rem .8rem}.phone-home-head .eyebrow{margin-bottom:.25rem}.phone-home-head h1{font-size:1.8rem;margin:.2rem 0}.phone-home-head p:last-child{color:#667c8a;line-height:1.5}.app-glyph{width:58px;height:58px;margin:0 auto .8rem;border-radius:18px;display:grid;place-items:center;color:#fff;font-size:1.45rem;background:linear-gradient(145deg,#168bb8,#0b639a);box-shadow:0 12px 24px rgba(11,99,154,.22)}.app-icon:nth-child(2) .app-glyph{background:linear-gradient(145deg,#2bc36b,#14934c);box-shadow:0 12px 24px rgba(20,147,76,.22)}.phone-disconnect button{width:100%;margin-top:2rem;border-radius:13px;background:#fff;color:#536a78;border:1px solid #d8e3e9;box-shadow:none}</style><div class="phone-home-head"><p class="eyebrow">Connected</p><h1>Good day</h1><p>Open your messages or dial the TrustID service code.</p></div><div class="app-grid"><a class="app-icon" href="/phone/messages"><span class="app-glyph">✉</span>Messages{% if unread_count %}<br><small>{{unread_count}} unread</small>{% endif %}</a><a class="app-icon" href="/phone/dialer"><span class="app-glyph">●</span>Keypad</a></div><form class="phone-disconnect" method="post" action="/phone/disconnect"><button class="secondary">Change mobile number</button></form>{% endblock %}
