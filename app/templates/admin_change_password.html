{% extends "base.html" %}{% block content %}
<div class="card" style="max-width:520px;margin:auto"><h1>Change administrator password</h1><p>The initial setup password must be replaced before administration can continue.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{session.csrf_token}}"><label>Current password<input type="password" name="current_password" required autocomplete="current-password"></label><label>New password<input type="password" name="new_password" required minlength="10" maxlength="64" autocomplete="new-password" data-password-field><small>Password must contain at least 10 characters.</small></label><label>Confirm new password<input type="password" name="password_confirm" required minlength="10" maxlength="64" autocomplete="new-password" data-confirm-password><small data-match-message>Enter the same password again.</small></label><button>Change password</button></form></div>
{% endblock %}
