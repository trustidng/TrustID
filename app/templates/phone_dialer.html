{% extends "phone_base.html" %}{% block phone_title %}Phone{% endblock %}{% block phone_content %}
<style>
  .dialer{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:0 0 .4rem}.dialer-label{font-size:.7rem;color:#708592;margin:0 0 .1rem}.dial-number{width:100%;min-height:48px;border:0!important;background:transparent!important;color:#0a2236!important;text-align:center;font-size:1.85rem!important;font-weight:500;letter-spacing:.03em!important;padding:.1rem!important;box-shadow:none!important}.dial-number:focus{outline:none}.dialpad{display:grid;grid-template-columns:repeat(3,clamp(56px,18vw,70px));gap:clamp(5px,1.1vh,10px) clamp(14px,4vw,20px);justify-content:center;margin:.25rem 0 .6rem}.dial-key{width:clamp(56px,18vw,70px);height:clamp(56px,18vw,70px);padding:0;border:0;border-radius:50%;background:#e2e7ea;color:#071d2e;box-shadow:none;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.7rem;font-weight:500;line-height:1;transition:transform .1s ease,background .1s ease}.dial-key small{font-size:.5rem;letter-spacing:.18em;margin-top:.25rem;color:#536873;font-weight:800}.dial-key:hover{transform:none;background:#d4dde2}.dial-key:active{transform:scale(.92);background:#c9d5db}.dial-actions{width:min(250px,80%);display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center}.call-button{grid-column:2;width:62px;height:62px;border-radius:50%;padding:0;background:#20a956;box-shadow:0 10px 24px rgba(32,169,86,.3);display:grid;place-items:center}.call-button svg{width:30px;height:30px;display:block;fill:#fff}.call-button:hover{background:#159348}.delete-key{grid-column:3;border:0;background:transparent;color:#536873;font-size:1.25rem;box-shadow:none}.delete-key:hover{box-shadow:none;background:#e5ecef;transform:none}.dial-hint{font-size:.69rem;color:#708592;margin:.5rem 0 0}.dial-hint strong{color:#087e9b}@media(max-height:760px){.dial-number{font-size:1.55rem!important;min-height:38px}.dialpad{grid-template-columns:repeat(3,54px);gap:5px 17px}.dial-key{width:54px;height:54px;font-size:1.45rem}.call-button{width:52px;height:52px}.call-button svg{width:25px;height:25px}.dial-hint{margin-top:.25rem}}
</style>
<form class="dialer" method="post" action="/phone/dial" data-dialer><p class="dialer-label">Enter a number or service code</p><label class="sr-only" for="service-code">Service code</label><input class="dial-number" id="service-code" name="service_code" value="*7305#" required autocomplete="off" inputmode="tel" aria-live="polite"><div class="dialpad" aria-label="Dial pad"><button class="dial-key" type="button" data-key="1">1</button><button class="dial-key" type="button" data-key="2">2<small>ABC</small></button><button class="dial-key" type="button" data-key="3">3<small>DEF</small></button><button class="dial-key" type="button" data-key="4">4<small>GHI</small></button><button class="dial-key" type="button" data-key="5">5<small>JKL</small></button><button class="dial-key" type="button" data-key="6">6<small>MNO</small></button><button class="dial-key" type="button" data-key="7">7<small>PQRS</small></button><button class="dial-key" type="button" data-key="8">8<small>TUV</small></button><button class="dial-key" type="button" data-key="9">9<small>WXYZ</small></button><button class="dial-key" type="button" data-key="*">*</button><button class="dial-key" type="button" data-key="0">0<small>+</small></button><button class="dial-key" type="button" data-key="#">#</button></div><div class="dial-actions"><button class="call-button" type="submit" aria-label="Call"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.62 10.79a15.46 15.46 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.61 21 3 13.39 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02l-2.2 2.2Z"/></svg></button><button class="delete-key" type="button" data-delete aria-label="Delete last digit">⌫</button></div><p class="dial-hint">Dial <strong>*7305#</strong> to access TrustID</p></form>
{% endblock %}
